name: Build AURORA for Windows

on: [workflow_dispatch, push]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: AURORA-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
